name: Leiakoristaja Automation

on:
  workflow_dispatch:

  schedule:
    - cron: '0 3 * * *'

jobs:
  api-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Run API Test
        env:
          BD_API_KEY: ${{ secrets.BD_API_KEY }}
          BD_SITE_URL: ${{ secrets.BD_SITE_URL }}
        run: php scripts/test_api.php

          if [ -z "$BD_API_KEY" ]; then
            echo "❌ API Key puudub!"
            exit 1
          else
            echo "✅ API Key leitud."
          fi
